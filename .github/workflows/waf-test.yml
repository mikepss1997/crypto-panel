name: waf-500-investigate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Investigate 500 and new endpoints
      run: |
        UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
        BASE="https://wpdataservice.wisepay.com.br"
        
        echo "IP: $(curl -s https://api.ipify.org)"
        
        echo ""
        echo "=== 500 completo para white-label (fabiane) ==="
        curl -v -s -m 15 \
          -A "$UA" \
          -H "Content-Type: application/json" \
          -H "Origin: https://petcenterbrasil.wisepay.com.br" \
          -H "Referer: https://petcenterbrasil.wisepay.com.br/login" \
          -H "type-application: web" \
          -H "Sec-Fetch-Site: same-site" \
          -H "Sec-Fetch-Mode: cors" \
          -X POST "$BASE/login" \
          -d '{"email":"fabiane@petcenterbrasil.com.br","password":"08710871"}' \
          -w "\nSTATUS:%{http_code}" 2>&1 | grep -v "^* " | head -30
        
        echo ""
        echo "=== 500 sem Origin header (fabiane) ==="
        curl -s -m 15 \
          -A "$UA" \
          -H "Content-Type: application/json" \
          -H "type-application: web" \
          -X POST "$BASE/login" \
          -d '{"email":"fabiane@petcenterbrasil.com.br","password":"08710871"}' \
          -w "\nSTATUS:%{http_code}"
        
        echo ""
        echo "=== POST /users (criar conta) ==="
        curl -s -m 15 \
          -A "$UA" \
          -H "Content-Type: application/json" \
          -H "type-application: web" \
          -H "Origin: https://portal.wisepay.com.br" \
          -X POST "$BASE/users" \
          -d '{"name":"Carlos Mendes","email":"carlos.mendes874@gmail.com","cpf":"12345678901","phone":"11987654321","password":"Carlos@2024!","password_confirmation":"Carlos@2024!"}' \
          -w "\nSTATUS:%{http_code}"
        
        echo ""
        echo "=== Password recover para email teste ==="
        curl -s -m 15 \
          -A "$UA" \
          -H "Content-Type: application/json" \
          -H "type-application: web" \
          -H "Origin: https://portal.wisepay.com.br" \
          -X POST "$BASE/login/password-recover" \
          -d '{"email":"email-naoexiste-xyzabc999@gmail.com"}' \
          -w "\nSTATUS:%{http_code}"
        
        echo ""
        echo "=== Password recover para icelaserbelem@gmail.com ==="
        curl -s -m 15 \
          -A "$UA" \
          -H "Content-Type: application/json" \
          -H "type-application: web" \
          -H "Origin: https://portal.wisepay.com.br" \
          -X POST "$BASE/login/password-recover" \
          -d '{"email":"icelaserbelem@gmail.com"}' \
          -w "\nSTATUS:%{http_code}"
        
        echo ""
        echo "=== GET /users/theme sem auth (empresa ID 1 = WisePay root) ==="
        curl -s -m 15 \
          -A "$UA" \
          -H "type-application: web" \
          "$BASE/users/theme" \
          -w "\nSTATUS:%{http_code}"
